services:
  db:
    image: postgres:16-alpine
    container_name: github_osint_db
    environment:
      POSTGRES_USER: osint
      POSTGRES_PASSWORD: osint
      POSTGRES_DB: github_osint
    # DB is internal-only by default (safer for shared demos).
    # To reach from host psql, uncomment:
    # ports:
    #   - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osint -d github_osint"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: github_osint_api
    environment:
      DATABASE_URL: postgresql://osint:osint@db:5432/github_osint
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Local demo only — change ADMIN_TOKEN for any shared deploy
      ADMIN_TOKEN: ${ADMIN_TOKEN:-changeme}
      APP_ENV: development
      FRONTEND_URL: http://localhost:8080
      PUBLIC_API_URL: http://localhost:8000
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    container_name: github_osint_web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
