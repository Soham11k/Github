services:
  db:
    image: postgres:16-alpine
    container_name: github_osint_db
    environment:
      POSTGRES_USER: osint
      POSTGRES_PASSWORD: osint
      POSTGRES_DB: github_osint
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/indexes.sql:/docker-entrypoint-initdb.d/02_indexes.sql:ro
      - ./sql/triggers.sql:/docker-entrypoint-initdb.d/03_triggers.sql:ro
      - ./sql/views.sql:/docker-entrypoint-initdb.d/04_views.sql:ro
      - ./sql/procedures.sql:/docker-entrypoint-initdb.d/05_procedures.sql:ro
      - ./sql/grants.sql:/docker-entrypoint-initdb.d/06_grants.sql:ro
      - ./sql/seed_demo.sql:/docker-entrypoint-initdb.d/07_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osint -d github_osint"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: github_osint_api
    environment:
      DATABASE_URL: postgresql://osint:osint@db:5432/github_osint
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-changeme}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    container_name: github_osint_web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
