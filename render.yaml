# RepoPulse — Render Blueprint
# Replace yourdomain.com placeholders before first deploy (or set custom domains in the dashboard).

services:
  - type: web
    name: repopulse-api
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    preDeployCommand: cd backend && PYTHONPATH=. python -m app.migrate
    startCommand: cd backend && PYTHONPATH=. uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: repopulse-shared
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SESSION_SECRET
        generateValue: true
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_GITHUB_LOGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: repopulse-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; font-src 'self' data:;"
    routes:
      - type: rewrite
        source: /sitemap.xml
        destination: https://api.yourdomain.com/api/sitemap.xml
      - type: rewrite
        source: /*
        destination: /index.html

  - type: cron
    name: repopulse-nightly
    runtime: python
    region: singapore
    schedule: "30 21 * * *"
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && PYTHONPATH=. python -m app.worker --nightly
    envVars:
      - fromGroup: repopulse-shared
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.8"

envVarGroups:
  - name: repopulse-shared
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: APP_NAME
        value: RepoPulse
