name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: osint
          POSTGRES_PASSWORD: osint
          POSTGRES_DB: github_osint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U osint -d github_osint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://osint:osint@localhost:5432/github_osint
      PGPASSWORD: osint
      APP_ENV: development
      ADMIN_TOKEN: test-admin-token
      ADMIN_GITHUB_LOGINS: testadmin
      SESSION_SECRET: test-session-secret-not-for-prod
      CORS_ORIGINS: http://localhost:5173
      GITHUB_OAUTH_CLIENT_ID: test-client
      GITHUB_OAUTH_CLIENT_SECRET: test-secret
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Migrate + pytest
        working-directory: backend
        run: |
          python -m app.migrate
          pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
