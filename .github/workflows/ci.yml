name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: osint
          POSTGRES_PASSWORD: osint
          POSTGRES_DB: github_osint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U osint -d github_osint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://osint:osint@localhost:5432/github_osint
      PGPASSWORD: osint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply SQL
        run: |
          for f in schema indexes triggers views procedures grants; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "sql/${f}.sql"
          done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/seed_demo.sql
      - name: Smoke demo queries (non-interactive subset)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM repositories;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT * FROM v_dashboard_kpis;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM mv_repo_health_summary;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CALL sp_refresh_analytics();"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "EXPLAIN SELECT full_name, stars FROM repositories ORDER BY stars DESC LIMIT 5;"
      - name: Install backend + import check
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -c "from app.main import app; from app.services.github_client import GitHubClient; print('ok', app.title)"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
